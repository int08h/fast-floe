name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  default-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --all-targets
      - run: cargo test --doc

  single-provider:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider:
          - aws-lc-rs
          - boring
          - ring
          - rustcrypto
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --all-targets --no-default-features --features "${{ matrix.provider }}"

  provider-pairs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        providers:
          - aws-lc-rs,boring
          - aws-lc-rs,ring
          - aws-lc-rs,rustcrypto
          - boring,ring
          - boring,rustcrypto
          - ring,rustcrypto
    steps:
      - uses: actions/checkout@v4
      - run: cargo check --all-targets --no-default-features --features "${{ matrix.providers }}"

  all-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: cargo test --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  feature-unification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --manifest-path tests/fixtures/provider-unification/Cargo.toml

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Generate coverage report
        run: cargo tarpaulin --engine llvm --out Lcov --timeout 300
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          format: lcov
