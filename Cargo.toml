[package]
name = "fast-floe"
version = "0.3.3"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
description = "High performance, spec-compliant Fast Lightweight Online Encryption (FLOE) implementation"
readme = "README.md"
documentation = "https://docs.rs/fast-floe"
repository = "https://github.com/int08h/fast-floe"
keywords = ["cryptography", "encryption", "floe", "random-access", "streaming"]
categories = ["cryptography"]
exclude = ["kats/"]

[features]
default = ["aws-lc-rs"]
rustcrypto = [
    "dep:aes",
    "dep:aes-gcm",
    "dep:getrandom",
    "dep:ghash",
    "dep:hmac",
    "dep:rand_chacha",
    "dep:sha2",
]
aws-lc-rs = ["dep:aws-lc-rs"]
boring = ["dep:boring"]
ring = ["dep:ring"]

# 'aes-gcm' does not forward the 'zeroize' feature to its dep crates 'aes' and 'ghash'
# so we specify them explicity and let cargo's feature unification forward 'zeroize' to them.
[dependencies]
aes = { version = "0.9", optional = true, default-features = false, features = ["zeroize"] }
aes-gcm = { version = "0.11", optional = true, default-features = false, features = ["aes", "zeroize"] }
ghash = { version = "0.6", optional = true, default-features = false, features = ["zeroize"] }
aws-lc-rs = { version = "1.17", optional = true }
boring = { version = "5.1", optional = true }
getrandom = { version = "0.4", optional = true }
hmac = { version = "0.13", optional = true }
rand_chacha = { version = "0.10", optional = true }
ring = { version = "0.17", optional = true }
sha2 = { version = "0.11", optional = true }
subtle = "2.6"
zeroize = "1.9"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
hex = "0.4"
rayon = "1.12"

[[bench]]
name = "backend_matrix"
harness = false

[[bench]]
name = "io_adapters"
harness = false

# codegen-units = 1 necessary for RustCrypto aes-gcm otherwise swings its throughput ~30%
[profile.bench]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
